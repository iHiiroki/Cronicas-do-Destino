{% extends "base.html" %}
{% set active_page = "adventures" %}

{% block title %}Aventuras — Crônicas do Destino{% endblock %}

{% block content %}
<div class="page-header fade-in-up">
  <div class="page-title-line">
    <h2>🗺️ Aventuras</h2>
  </div>
  <p>Embarque em missões épicas. Suas escolhas moldam o destino.</p>
</div>

<!-- -- Abas: Disponíveis / Em Andamento / Concluídas -->
<div class="tabs fade-in-up">
  <button class="tab-btn active" id="tab-available" onclick="switchAdvTab('available')">⚔️ Disponíveis</button>
  <button class="tab-btn"        id="tab-ongoing"   onclick="switchAdvTab('ongoing')">📖 Em Andamento</button>
  <button class="tab-btn"        id="tab-completed" onclick="switchAdvTab('completed')">🏆 Concluídas</button>
</div>

<!-- ==========================================
     ABA: AVENTURAS DISPONÍVEIS
     ========================================== -->
<div id="panel-available">

  <!-- -- Seletor de personagem e filtros -->
  <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px;" class="fade-in-up">
    <select class="filter-select" id="advCharSelect" style="min-width:220px;" onchange="onCharSelectChange()">
      <option value="">Selecione um personagem</option>
    </select>

    <select class="filter-select" id="advDifficulty" onchange="loadAvailableAdventures()">
      <option value="">Todas as dificuldades</option>
      <option value="fácil">Fácil</option>
      <option value="médio">Médio</option>
      <option value="difícil">Difícil</option>
    </select>
  </div>

  <div id="availableList" class="grid-auto">
    <div class="loading-center" style="grid-column:1/-1;"><div class="spinner"></div></div>
  </div>
</div>

<!-- ==========================================
     ABA: AVENTURAS EM ANDAMENTO
     ========================================== -->
<div id="panel-ongoing" style="display:none;">

  <div style="margin-bottom:20px;" class="fade-in-up">
    <select class="filter-select" id="ongoingCharSelect" style="min-width:220px;"
            onchange="loadOngoingSessions()">
      <option value="">Todos os personagens</option>
    </select>
  </div>

  <div id="ongoingList">
    <div class="loading-center"><div class="spinner"></div></div>
  </div>
</div>

<!-- ==========================================
     ABA: AVENTURAS CONCLUÍDAS
     ========================================== -->
<div id="panel-completed" style="display:none;">
  <div id="completedList">
    <div class="loading-center"><div class="spinner"></div></div>
  </div>
</div>

<!-- ==========================================
     MODAL: Painel de Aventura Ativa
     ========================================== -->
<div class="modal-overlay" id="adventureModal">
  <div class="modal" style="max-width:680px;">
    <div class="modal-header">
      <div>
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px;" id="advModalSubtitle">Aventura</div>
        <h3 class="modal-title" id="advModalTitle">—</h3>
      </div>
      <button class="modal-close" onclick="closeModal('adventureModal')">✕</button>
    </div>

    <!-- -- Painel do nó atual -->
    <div id="adventureNodePanel">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>

    <!-- -- Resultado de fim de aventura -->
    <div id="adventureEndPanel" style="display:none;"></div>

    <div class="d-flex justify-between" style="margin-top:16px;">
      <button class="btn btn-red btn-sm" id="abandonBtn" onclick="abandonSession()" style="display:none;">
        🚪 Abandonar Missão
      </button>
      <span id="advSessionInfo" style="font-size:11px; color:var(--text-faint);"></span>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/adventures.js"></script>
{% endblock %}
